name: movein
services:
  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    env_file: deploy/.env
    environment:
      DEMO_DATA_PATH: /app/backend/data/demo.json
    volumes:
      - demo_data:/app/backend/data
      - uploads:/app/backend/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
  web:
    build:
      context: .
      target: web
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
volumes:
  demo_data:
  uploads:
  caddy_data:
  caddy_config:
